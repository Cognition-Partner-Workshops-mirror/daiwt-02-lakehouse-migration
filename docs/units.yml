# Golden paths are relative to estate.yml golden_path. D0 only.
# Legacy sources are relative to daiwt-02-enterprise-etl. All 18 golden outputs are DW (gold) tables;
# there are no Silver goldens, so every unit is gold (see docs/estate_map.md).
estate: daiwt_02
source_dialect: tsql
drops:
- D0
units:
- name: load_city_dimension
  layer: gold
  legacy_sources:
  - wwi-ssdt/wwi-ssdt/Integration/Stored Procedures/GetCityUpdates.sql
  - wwi-dw-ssdt/wwi-dw-ssdt/Integration/Stored Procedures/MigrateStagedCityData.sql
  - wwi-dw-ssdt/wwi-dw-ssdt/Dimension/Tables/City.sql
  - wwi-ssis/wwi-ssis/DailyETLMain.dtsx
  outputs:
  - table: gold.dim_city
    golden: outputs/D0/tables/Dimension.City.csv
    keys:
    - city_key
  depends_on: []
  reads:
  - bronze.cities
  - bronze.cities_archive
  - bronze.stateprovinces
  - bronze.stateprovinces_archive
  - bronze.countries
  - bronze.countries_archive
  dialect_notes:
  - Change events = every ValidFrom in window across Countries, StateProvinces and Cities (base+archive); for each
    event re-read Cities INNER JOIN StateProvinces INNER JOIN Countries AS OF that instant for the affected scope
    (country / state / city). latest_recorded_population = COALESCE(city pop, 0) as bigint; sales_territory from
    StateProvinces; continent/region/subregion from Countries. 116,294 versions + key 0. All non-zero rows carry
    lineage_key 1.
  - 'SCD2 as in MigrateStaged*Data: stage every change version, valid_to = next valid_from of the same WWI id else
    end-of-time; insert every staged version (no change detection, no dedup). Key 0 ''Unknown'' member (valid_from
    2013-01-01, valid_to end-of-time, lineage_key 0) is part of the golden. Keys follow staged order (valid_from,
    then WWI id); verify against golden.'
  - 'Golden D0 is the restored WideWorldImportersDW state at cutoff 2016-06-06 12:31:17 (one historical run per
    entity, lineage keys 1-13). Rebuild it from D0 bronze as a single window (2012-12-31 00:00, 2016-06-06 12:31:17].
    Bronze inputs are bronze.<lowercase OLTP table> (e.g. bronze.cities, bronze.cities_archive) with SQL Server
    temporal ValidFrom/ValidTo; base UNION ALL _Archive gives history, AS OF t means ValidFrom <= t < ValidTo. Surrogate
    keys and lineage_key are compared strictly: reproduce golden values, never sequence-generate blindly. Decimal
    arithmetic only (never double), ROUND is half-away-from-zero, CAST(decimal AS int) truncates toward zero, CAST(datetime2
    AS date) truncates. NULL is \N; empty string is not NULL. Timestamps are naive datetime2(7) (use TIMESTAMP_NTZ
    semantics); end-of-time is 9999-12-31 23:59:59.9999999. bit -> boolean, geography -> WKT string as landed, varbinary
    -> uppercase hex string as landed. Integer IDs are the only join keys (collation irrelevant).'
