resources:
  pipelines:
    customer_silver:
      name: ${var.job_name_prefix}customer_silver
      catalog: ${var.catalog}
      schema: ${var.silver_schema}
      serverless: true
      continuous: false
      root_path: ../src/units/customer
      libraries:
        - file:
            path: ../src/units/customer/customer_changes.py
      configuration:
        source_catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}
      permissions:
        - level: CAN_VIEW
          group_name: users
  jobs:
    wwi_customer_to_silver:
      name: ${var.job_name_prefix}wwi_customer_to_silver
      max_concurrent_runs: 1
      permissions:
        - level: CAN_VIEW
          group_name: users
      parameters:
        - name: drop
          default: D0
        - name: last_cutoff
          default: ""
        - name: new_cutoff
          default: ""
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/units/customer/bronze.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              golden_path: ${var.golden_path}
        - task_key: pipeline
          depends_on:
            - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.customer_silver.id}
            full_refresh: true
        - task_key: parity
          depends_on:
            - task_key: pipeline
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/units/customer/parity.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              golden_path: ${var.golden_path}
              drop: "{{job.parameters.drop}}"
