resources:
  pipelines:
    wwi_order_to_silver_pipeline:
      name: ${var.job_name_prefix}wwi_order_to_silver
      catalog: ${var.catalog}
      schema: ${var.silver_schema}
      serverless: true
      photon: true
      libraries:
        - file:
            path: ../src/sql/units/wwi_order_to_silver/pipeline.sql
      configuration:
        bronze_fqn: ${var.catalog}.${var.bronze_schema}
        window_fqn: ${var.catalog}.${var.silver_schema}.order_extract_window

  jobs:
    wwi_order_to_silver:
      name: ${var.job_name_prefix}wwi_order_to_silver
      max_concurrent_runs: 1
      parameters:
        - name: drop
          default: ${var.drop}
        - name: last_cutoff
          default: ${var.last_cutoff}
        - name: new_cutoff
          default: ${var.new_cutoff}
        - name: baseline_cutoff
          default: "2012-12-31 00:00:00.0000000"
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
      tasks:
        - task_key: extract_window
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/units/wwi_order_to_silver/window.sql
              source: WORKSPACE
        - task_key: silver_pipeline
          depends_on:
            - task_key: extract_window
          pipeline_task:
            pipeline_id: ${resources.pipelines.wwi_order_to_silver_pipeline.id}
            full_refresh: true
        - task_key: parity
          depends_on:
            - task_key: silver_pipeline
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/units/wwi_order_to_silver/parity.sql
              source: WORKSPACE
