resources:
  pipelines:
    purchase_silver_pipeline:
      name: ${var.job_name_prefix}wwi_purchase_to_silver
      catalog: ${var.catalog}
      schema: ${var.silver_schema}
      serverless: true
      continuous: false
      root_path: ../src/sql/units
      libraries:
        - file:
            path: ../src/sql/units/purchase_pipeline.py
      configuration:
        purchase.catalog: ${var.catalog}
        purchase.bronze_schema: ${var.bronze_schema}
        purchase.golden_path: ${var.golden_path}
  jobs:
    wwi_purchase_to_silver:
      name: ${var.job_name_prefix}wwi_purchase_to_silver
      parameters:
        - name: drop
          default: ${var.drop}
        - name: last_cutoff
          default: ${var.last_cutoff}
        - name: new_cutoff
          default: ${var.new_cutoff}
      environments:
        - environment_key: dev
          spec:
            environment_version: "4"
      tasks:
        - task_key: purchase_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.purchase_silver_pipeline.id}
            full_refresh: true
        - task_key: parity_verify
          depends_on:
            - task_key: purchase_pipeline
          environment_key: dev
          notebook_task:
            notebook_path: ../src/sql/units/purchase_verify.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              golden_path: ${var.golden_path}
              drop: "{{job.parameters.drop}}"
