resources:
  pipelines:
    wwi_employee_pipeline:
      name: ${var.job_name_prefix}wwi_employee_to_silver
      catalog: ${var.catalog}
      target: ${var.silver_schema}
      serverless: true
      configuration:
        bronze_catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}
        temporal_schema: ${var.silver_schema}
      libraries:
        - file:
            path: ../src/sql/units/wwi_employee_to_silver/employee.sql
  jobs:
    wwi_employee_to_silver:
      name: ${var.job_name_prefix}wwi_employee_to_silver
      max_concurrent_runs: 1
      parameters:
        - name: drop
          default: ${var.drop}
        - name: last_cutoff
          default: ${var.last_cutoff}
        - name: new_cutoff
          default: ${var.new_cutoff}
      tasks:
        - task_key: silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.wwi_employee_pipeline.id}
            full_refresh: true
        - task_key: parity
          depends_on:
            - task_key: silver
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/units/wwi_employee_to_silver/parity.sql
            parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              golden_path: ${var.golden_path}
              drop: "{{job.parameters.drop}}"
              last_cutoff: "{{job.parameters.last_cutoff}}"
              new_cutoff: "{{job.parameters.new_cutoff}}"
