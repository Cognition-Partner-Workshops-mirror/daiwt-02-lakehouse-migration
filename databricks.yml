bundle:
  name: daiwt-02-migration

include:
  - resources/*.yml
  - src/s11_sale/resources.yml

variables:
  drop:
    description: Runner overrides this per drop at run time.
    default: D0
  last_cutoff:
    description: Runner overrides this per drop at run time.
    default: "2016-06-06 12:31:17.0000000"
  new_cutoff:
    description: Runner overrides this per drop at run time.
    default: "2016-06-06 12:31:17.0000000"
  catalog:
    description: Target Unity Catalog catalog.
  schema_suffix:
    default: ${workspace.current_user.short_name}
  bronze_schema:
    default: bronze_${var.schema_suffix}
  silver_schema:
    default: silver_${var.schema_suffix}
  gold_schema:
    default: gold_${var.schema_suffix}
  warehouse_id:
    default: 6dc4b80538621b7b
  golden_path:
    default: /Volumes/daiwt_02_mig_prod/landing/golden
  job_name_prefix:
    description: Prefix for bundle job names (presets.name_prefix would also rename schemas).
    default: "[${var.schema_suffix}] "

targets:
  dev:
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev/${var.schema_suffix}
    variables:
      catalog: daiwt_02_mig_dev
    resources:
      schemas:
        bronze:
          name: ${var.bronze_schema}
          catalog_name: ${var.catalog}
          comment: daiwt-02-migration
        silver:
          name: ${var.silver_schema}
          catalog_name: ${var.catalog}
          comment: daiwt-02-migration
        gold:
          name: ${var.gold_schema}
          catalog_name: ${var.catalog}
          comment: daiwt-02-migration
  prod:
    mode: production
    permissions:
      - service_principal_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - group_name: users
        level: CAN_VIEW
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    variables:
      catalog: daiwt_02_mig_prod
      schema_suffix: prod
      job_name_prefix: ""
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
