bundle:
  name: daiwt_02-migration
  databricks_cli_version: '>= 1.25.0'
python:
  resources:
  - migration_resources:load_resources
sync:
  include:
  - .migration/framework/**
  - estate.yml
variables:
  catalog:
    description: Target catalog
  schema_suffix:
    description: Optional isolated schema suffix, e.g. _pilot
    default: ''
  warehouse_id:
    default: 6dc4b80538621b7b
  golden_path:
    default: /Volumes/daiwt_02_mig_prod/migration_ci_fixtures/golden
targets:
  dev:
    permissions:
    - service_principal_name: ${workspace.current_user.userName}
      level: CAN_MANAGE
    - group_name: users
      level: CAN_VIEW
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev${var.schema_suffix}
    variables:
      catalog: daiwt_02_mig_dev
    default: true
    presets:
      trigger_pause_status: PAUSED
  prod:
    permissions:
    - service_principal_name: ${workspace.current_user.userName}
      level: CAN_MANAGE
    - group_name: users
      level: CAN_VIEW
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod${var.schema_suffix}
    variables:
      catalog: daiwt_02_mig_prod
    mode: production
